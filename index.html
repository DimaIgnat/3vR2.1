<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Match3 Stones</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <div id="levelDisplay">Уровень: <span id="levelValue">1</span></div>
    <div class="xp-wrap">
      <div id="xpText">0 / 100 XP</div>
      <div class="xp-bar"><div id="xpFill"></div></div>
    </div>
  </header>

  <main class="main">
    <div id="board" class="board"></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="game">Игра</button>
    <button class="nav-btn" data-screen="profile">Профиль</button>
  </nav>

  <section id="profile" class="screen hidden">
    <div class="profile-box">
      <h3>Профиль</h3>
      <label>Имя</label>
      <input id="playerName" placeholder="Ваше имя" />
      <div class="profile-level">Уровень: <span id="profileLevel">1</span></div>
      <button id="saveNameBtn">Сохранить</button>
      <button id="closeProfileBtn">Закрыть</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
